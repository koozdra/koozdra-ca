<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot Explorer · Dimitri Tishchenko</title>
  <meta name="description" content="Deep-zoom Mandelbrot set explorer rendered with web workers.">
  <meta name="author" content="Dimitri Tishchenko">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script src="run.js" defer></script>
</head>

<body >

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">Dimitri Tishchenko</a>
      <nav class="site-nav" aria-label="Main">
        <a href="/projects/" aria-current="true">Projects</a>
        <a href="/blog/">Blog</a>
        <a href="/photography/">Photography</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

<main class="page page--wide page--app">
  <div class="starter-template container-fluid">

    <a class="back-link" href="/projects/">← Projects</a>
  </div>
  <div class="text-center">
    <canvas id="board" width="280" height="180" style="border: 1px solid"></canvas>
  </div>

  <div class="row">
    <div class="col-md-2">
      <strong>Click Mode:</strong>
      <div>
      <div class="radio">
        <label><input type="radio" name="clickMode" onclick="clickModeZoomIn();" checked>Zoom In</label>
        </div>
        <div class="radio">
        <label><input type="radio" name="clickMode" onclick="clickModeZoomOut();">Zoom Out</label>
        </div>
        <div class="radio">
        <label><input type="radio" name="clickMode" onclick="clickModeCenter();">Center</label>
        </div>
      </div>
    </div>

    <div class="col-md-2">
      <strong>Size:</strong>
      <div class="radio">
        <label><input type="radio" name="size" onclick="sizeXSmall();">Extra Small</label>
      </div>
      <div class="radio">
        <label><input type="radio" name="size" onclick="sizeSmall();" checked>Small</label>
      </div>
      <div class="radio">
        <label><input type="radio" name="size" onclick="sizeMedium();">Medium</label>
      </div>
      <div class="radio">
        <label><input type="radio" name="size" onclick="sizeLarge();">Large</label>
      </div>
      <div class="radio">
        <label><input type="radio" name="size" onclick="sizeFull();">Full</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="range full-width">
        <label style="width:100%"><input value="2500" type="range" name="test" min="2500" max="250000" id="rangeIterations">Iterations</label>
      </div>
    </div>
  </div>

  <div>
    <strong>Location:</strong>
    <span class="currentLocation"></span>
  </div>

  <div>
    <strong>Render:</strong>
    <span class="renderStatus"></span>
  </div>

  <div>
    <strong>Output:</strong><br/>

    <button class="btn" onclick="generateImage();">Generate Image</button>

  </div>

  <div class="imageOutput">
    <br/><br/>

  </div>

  <div>
    <strong>Bookmark Dev</strong>
    <ul>
      <li>
        <a href="/projects/mandelbrot/show.html?x=-1.7320030506165627&y=0.0005689874216009001&zoom=3.874204889999998e-10">Location 1</a>
      </li>
      <li>
        <a href="/projects/mandelbrot/show.html?x=-1.7499977518652907&y=3.9513418543621205e-8&zoom=8.08432815650446e-10">Location 2</a>
      </li>
    </ul>
  </div>

</main>

      </ul>
    </div>
  </footer>

</body>
</html>
