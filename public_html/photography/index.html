<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography · Dimitri Tishchenko</title>
  <meta name="description" content="A selection of Dimitri Tishchenko's photography.">
  <meta name="author" content="Dimitri Tishchenko">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">Dimitri Tishchenko</a>
      <nav class="site-nav" aria-label="Main">
        <a href="/projects/">Projects</a>
        <a href="/blog/">Blog</a>
        <a href="/photography/" aria-current="page">Photography</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <header class="page-header">
      <h1>Photography</h1>
      <p>A selection of my photography. There's more on <a href="https://www.flickr.com/photos/38565795@N05/albums">Flickr</a>.</p>
    </header>
    <ul class="gallery">
      <li><button type="button" aria-label="View photo 3 larger"><img src="3.jpg" width="411" height="640" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 1 larger"><img src="1.jpg" width="640" height="336" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 2 larger"><img src="2.jpg" width="640" height="447" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 4 larger"><img src="4.jpg" width="640" height="321" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 5 larger"><img src="5.jpg" width="640" height="553" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 6 larger"><img src="6.jpg" width="640" height="410" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 7 larger"><img src="7.jpg" width="640" height="424" alt="" loading="lazy"></button></li>
      <li><button type="button" aria-label="View photo 9 larger"><img src="9.jpg" width="640" height="424" alt="" loading="lazy"></button></li>
    </ul>
    <dialog class="lightbox" aria-label="Photo">
      <img alt="">
      <form method="dialog"><button aria-label="Close">×</button></form>
    </dialog>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© Dimitri Tishchenko</span>
      <ul>
        <li><a href="https://github.com/koozdra">GitHub</a></li>
        <li><a href="https://twitter.com/koozdra">Twitter</a></li>
        <li><a href="https://www.youtube.com/user/koozdra">YouTube</a></li>
        <li><a href="https://www.flickr.com/photos/38565795@N05/">Flickr</a></li>
        <li><a href="https://www.printables.com/@DimitriTishc_1975665">Printables</a></li>
      </ul>
    </div>
  </footer>
  <script>
    const lightbox = document.querySelector(".lightbox");
    const big = lightbox.querySelector("img");
    for (const button of document.querySelectorAll(".gallery button")) {
      button.addEventListener("click", () => {
        big.src = button.querySelector("img").src;
        lightbox.showModal();
      });
    }
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>
</body>
</html>
